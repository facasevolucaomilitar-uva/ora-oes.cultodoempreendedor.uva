<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200">
  <defs>
    <!-- Gradiente Dourado Sutil Premium -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Brilho Suave para as Letras -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&amp;family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      
      .text-ad-title {
        font-family: 'Montserrat', 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 900;
        text-anchor: middle;
        text-transform: uppercase;
      }
      
      .text-ad-sub {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 700;
        text-anchor: middle;
        text-transform: uppercase;
        letter-spacing: 7px;
        fill: #94a3b8;
      }
    </style>
  </defs>

  <!-- Grupo Principal com Sombra Suave -->
  <g filter="url(#softGlow)">
    
    <!-- Linha Superior: Ícone Sutil / Estrela Espiritual -->
    <text x="350" y="48" font-size="20" fill="url(#goldGrad)" text-anchor="middle">✦ ✦ ✦</text>

    <!-- Escrita Principal Moderna: ASSEMBLÉIA DE DEUS -->
    <text x="350" y="118" class="text-ad-title">
      <!-- Palavra ASSEMBLÉIA em Branco Puro Alto Impacto -->
      <tspan fill="#ffffff" font-size="52" letter-spacing="4px">ASSEMBLÉIA </tspan>
      <!-- Expressão DE DEUS em Dourado Moderno / Alta Nobreza -->
      <tspan fill="url(#goldGrad)" font-size="52" letter-spacing="5px">DE DEUS</tspan>
    </text>

    <!-- Linha Decorativa Minimalista -->
    <line x1="220" y1="138" x2="480" y2="138" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- Subtítulo Moderno: União da Vitória - PR -->
    <text x="350" y="165" font-size="13" class="text-ad-sub">
      União da Vitória • PR
    </text>

  </g>
</svg>
